name: Build MH SIGNATURE

on:
  push:
    branches: ['**']
    paths:
      - 'plugin/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'plugin/**'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------ Windows
  windows:
    name: Windows x64 (VST3)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: pwsh
        run: |
          cmake -S plugin -B build -G "Visual Studio 17 2022" -A x64 -DMH_FORMATS="VST3;Standalone" *>&1 | Tee-Object configure.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 3 *>&1 | Tee-Object build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Show artefacts
        run: Get-ChildItem -Recurse build/MHSignature_artefacts | Select-Object FullName

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: MH-SIGNATURE-Windows-x64-VST3
          path: build/MHSignature_artefacts/Release/VST3/MH SIGNATURE.vst3
          if-no-files-found: error

      - name: Upload Standalone
        uses: actions/upload-artifact@v4
        with:
          name: MH-SIGNATURE-Windows-x64-Standalone
          path: build/MHSignature_artefacts/Release/Standalone/MH SIGNATURE.exe
          if-no-files-found: warn

      - name: Publish build log
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PLATFORM: Windows
          JOB_STATUS: ${{ job.status }}
        run: |
          python - <<'PYLOG' > payload.json
          import json, os
          parts = []
          for f in ("configure.log", "build.log"):
              if os.path.exists(f):
                  parts.append(open(f, errors="replace").read())
          log = "\n".join(parts)
          ok = os.environ.get("JOB_STATUS") == "success"
          log = log[-3000:] if ok else log[-52000:]
          body = "**%s — %s** · %s\n\n```\n%s\n```" % (
              os.environ["PLATFORM"], "OK" if ok else "FAILED",
              os.environ["RUN_URL"], log)
          print(json.dumps({"body": body}))
          PYLOG
          gh api -X POST "repos/$REPO/issues/1/comments" --input payload.json > /dev/null || true

  # ------------------------------------------------- Linux compile check only
  linux:
    name: Linux compile check (VST3)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake libasound2-dev libfreetype6-dev \
            libx11-dev libxext-dev libxinerama-dev libxrandr-dev \
            libxcursor-dev libxcomposite-dev libxrender-dev libgl1-mesa-dev

      - name: Configure
        shell: bash
        run: |
          set -o pipefail
          cmake -S plugin -B build -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=Release -DMH_FORMATS="VST3" 2>&1 | tee configure.log

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cmake --build build --parallel 3 2>&1 | tee build.log

      - name: Publish build log
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PLATFORM: Linux
          JOB_STATUS: ${{ job.status }}
        run: |
          python3 - <<'PYLOG' > payload.json
          import json, os
          parts = []
          for f in ("configure.log", "build.log"):
              if os.path.exists(f):
                  parts.append(open(f, errors="replace").read())
          log = "\n".join(parts)
          ok = os.environ.get("JOB_STATUS") == "success"
          log = log[-3000:] if ok else log[-52000:]
          body = "**%s — %s** · %s\n\n```\n%s\n```" % (
              os.environ["PLATFORM"], "OK" if ok else "FAILED",
              os.environ["RUN_URL"], log)
          print(json.dumps({"body": body}))
          PYLOG
          gh api -X POST "repos/$REPO/issues/1/comments" --input payload.json > /dev/null || true
