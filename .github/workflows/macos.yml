name: Build MH SIGNATURE (macOS)

on:
  push:
    branches: ['**']
    paths:
      - 'plugin/**'
      - '.github/workflows/macos.yml'
  pull_request:
    paths:
      - 'plugin/**'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS universal (AU + VST3)
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: |
          set -o pipefail
          cmake -S plugin -B build -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DMH_FORMATS="VST3;AU;Standalone" 2>&1 | tee configure.log

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cmake --build build --parallel 3 2>&1 | tee build.log

      - name: Show artefacts
        run: find build/MHSignature_artefacts -maxdepth 4 | sort

      - name: Upload AU + VST3
        uses: actions/upload-artifact@v4
        with:
          name: MH-SIGNATURE-macOS-universal-AU-VST3
          path: |
            build/MHSignature_artefacts/Release/AU/MH SIGNATURE.component
            build/MHSignature_artefacts/Release/VST3/MH SIGNATURE.vst3
          if-no-files-found: error

      - name: Upload Standalone
        uses: actions/upload-artifact@v4
        with:
          name: MH-SIGNATURE-macOS-universal-Standalone
          path: build/MHSignature_artefacts/Release/Standalone/MH SIGNATURE.app
          if-no-files-found: warn

      - name: Publish build log
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PLATFORM: macOS
          JOB_STATUS: ${{ job.status }}
        run: |
          python3 - <<'PYLOG' > payload.json
          import json, os
          parts = []
          for f in ("configure.log", "build.log"):
              if os.path.exists(f):
                  parts.append(open(f, errors="replace").read())
          log = "\n".join(parts)
          ok = os.environ.get("JOB_STATUS") == "success"
          log = log[-3000:] if ok else log[-52000:]
          body = "**%s — %s** · %s\n\n```\n%s\n```" % (
              os.environ["PLATFORM"], "OK" if ok else "FAILED",
              os.environ["RUN_URL"], log)
          print(json.dumps({"body": body}))
          PYLOG
          gh api -X POST "repos/$REPO/issues/1/comments" --input payload.json > /dev/null || true
